spring:
  application:
    name: koraya

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/koraya}
    username: ${DATABASE_USERNAME:koraya}
    password: ${DATABASE_PASSWORD:koraya}

  jpa:
    hibernate:
      ddl-auto: validate   # Le schema est gere par Liquibase, jamais par Hibernate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml

server:
  port: ${PORT:8080}

koraya:
  jwt:
    secret: ${JWT_SECRET:change-this-secret-in-production-minimum-32-characters}
    access-token-expiration-minutes: 15
    refresh-token-expiration-days: 30
  bootstrap:
    admin-email: ${KORAYA_BOOTSTRAP_ADMIN_EMAIL:}
    admin-password: ${KORAYA_BOOTSTRAP_ADMIN_PASSWORD:}
    admin-full-name: ${KORAYA_BOOTSTRAP_ADMIN_FULL_NAME:Administrateur}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
