spring.application.name=koraya

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/koraya}
spring.datasource.username=${DATABASE_USERNAME:koraya}
spring.datasource.password=${DATABASE_PASSWORD:koraya}

# Le schema est gere par Liquibase, jamais par Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

server.port=${PORT:8081}

koraya.jwt.secret=${JWT_SECRET:change-this-secret-in-production-minimum-32-characters}
koraya.jwt.access-token-expiration-minutes=15
koraya.jwt.refresh-token-expiration-days=30

koraya.bootstrap.admin-email=${KORAYA_BOOTSTRAP_ADMIN_EMAIL:}
koraya.bootstrap.admin-password=${KORAYA_BOOTSTRAP_ADMIN_PASSWORD:}
koraya.bootstrap.admin-full-name=${KORAYA_BOOTSTRAP_ADMIN_FULL_NAME:Administrateur}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
